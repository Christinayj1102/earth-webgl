<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D Earth - WebGL</title>
  <style>
    body {
      margin: 0;
      background: #080d18;
      display: grid;
      place-items: center;
      height: 100vh;
    }
    canvas {
      width: min(800px, 100%);
      height: auto;
      aspect-ratio: 4 / 3;
      max-width: 100%;
      box-sizing: border-box;
      border: 1px solid #334155;
    }
    #controls {
      width: min(800px, 100%);
      box-sizing: border-box;
      padding: 12px 4px;
      color: #dbeafe;
      font: 14px sans-serif;
    }
    #elevationScale {
      width: 220px;
      vertical-align: middle;
    }
    #textureStatus {
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas" width="800" height="600"></canvas>
  <div id="controls">
    <label for="elevationScale">고도 과장 배율: <output id="elevationScaleValue">20</output></label>
    <input id="elevationScale" type="range" min="0" max="50" step="1" value="20">
    <span id="textureStatus">텍스처 로딩 중...</span>
  </div>

  <!-- 교수님 예제 방식의 HTML script 태그 내 셰이더 작성 -->
  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec4 aPosition;
    attribute vec3 aNormal;
    attribute vec4 aColor;
    attribute vec2 aTexCoord;

    uniform mat4 uModelView;
    uniform mat4 uProjection;

    varying vec3 vNormal;
    varying vec4 vColor;
    varying vec2 vTexCoord;

    void main() {
      gl_Position = uProjection * uModelView * aPosition;
      vNormal = mat3(uModelView) * aNormal;
      vColor = aColor;
      vTexCoord = aTexCoord;
    }
  </script>

  <script id="fragment-shader" type="x-shader/x-fragment">
    precision mediump float;

    varying vec3 vNormal;
    varying vec4 vColor;
    varying vec2 vTexCoord;

    uniform sampler2D uTexture;
    uniform bool uUseTexture;

    void main() {
      vec3 lightDirection = normalize(vec3(0.6, 0.8, 1.0));
      float diffuse = 0.35 + 0.65 * max(dot(normalize(vNormal), lightDirection), 0.0);
      vec4 surfaceColor = uUseTexture ? texture2D(uTexture, vTexCoord) : vColor;
      gl_FragColor = vec4(surfaceColor.rgb * diffuse, surfaceColor.a);
    }
  </script>

  <!-- 교수님 제공 공통 라이브러리의 수정 없는 재사용 -->
  <script src="Common/MV.js"></script>
  <script src="Common/webgl-utils.js"></script>
  <script src="Common/initShaders.js"></script>
  <script src="elevation.js"></script>
  <script src="earth.js"></script>
</body>
</html>
